<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="woodGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d97706" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Base Shield / Plywood Plies Layering -->
    <path d="M 50 5 L 88 28 L 88 72 L 50 95 L 12 72 L 12 28 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Layer 2: Mid Timber Ply -->
    <path d="M 50 14 L 80 32 L 80 66 L 50 84 L 20 66 L 20 32 Z" fill="url(#woodGrad1)" opacity="0.95" />
    
    <!-- Layer 3: Plywood Cross Core Striations -->
    <path d="M 24 38 L 76 38 L 74 44 L 26 44 Z" fill="#78350f" opacity="0.8" />
    <path d="M 28 50 L 72 50 L 70 56 L 30 56 Z" fill="#fef3c7" opacity="0.9" />
    <path d="M 32 62 L 68 62 L 66 68 L 34 68 Z" fill="#78350f" opacity="0.8" />

    <!-- Stylized "A" Triangle & "P" Overlap -->
    <path d="M 50 20 L 68 66 L 56 66 L 50 48 L 44 66 L 32 66 Z" fill="#ffffff" />
    <path d="M 44 42 L 56 42 L 50 28 Z" fill="url(#woodGrad1)" />

    <!-- Eco Leaf / Gurjan Quality Stamp atop -->
    <path d="M 50 6 C 58 -2, 70 2, 72 12 C 64 14, 54 12, 50 6 Z" fill="url(#leafGrad)" />
    <path d="M 50 6 C 42 -2, 30 2, 28 12 C 36 14, 46 12, 50 6 Z" fill="url(#leafGrad)" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g transform="translate(118, 20)">
    <!-- Main Brand Name -->
    <text x="0" y="44" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" fill="#ffffff">
      ANURADHA
    </text>
    <text x="238" y="44" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="36" font-weight="400" letter-spacing="2" fill="#fbbf24">
      PLYWOODS
    </text>

    <!-- Subtitle / Tagline & Location -->
    <g transform="translate(2, 68)">
      <rect x="0" y="-14" width="375" height="24" rx="4" fill="#1e293b" />
      <circle cx="10" cy="-2" r="3.5" fill="#10b981" />
      <text x="20" y="2" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" letter-spacing="1" fill="#cbd5e1">
        WHOLESALE &amp; RETAIL TIMBER HUB • VIJAYAWADA
      </text>
    </g>
  </g>
</svg>
